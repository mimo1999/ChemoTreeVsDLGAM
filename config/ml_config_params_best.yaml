Gradient Boosting:
  mimic_cohort_NF_30_days:
    learning_rate: 0.10
    max_iter: 200
    max_depth: null
  mimic_cohort_aplasia_45_days:
    learning_rate: 0.10
    max_iter: 200
    max_depth: 10
  uker_cohort_NF_30_days:
    learning_rate: 0.05
    max_iter: 200
    max_depth: null
  uker_cohort_aplasia_45_days:
    learning_rate: 0.10
    max_iter: 200
    max_depth: null

Logistic Regression:
  mimic_cohort_NF_30_days:
    C: 0.1
    penalty: l2
    class_weight: null
    max_iter: 2000
  mimic_cohort_aplasia_45_days:
    C: 0.01
    penalty: l2
    class_weight: null
    max_iter: 2000
  uker_cohort_NF_30_days:
    C: 0.01
    penalty: l2
    class_weight: null
    max_iter: 2000
  uker_cohort_aplasia_45_days:
    C: 0.01
    penalty: l2
    class_weight: null
    max_iter: 2000

Random Forest:
  mimic_cohort_NF_30_days:
    n_estimators: 250
    max_depth: 10
    min_samples_split: 15
    class_weight: {0: 1, 1: 1}
  mimic_cohort_aplasia_45_days:
    n_estimators: 250
    max_depth: 10
    min_samples_split: 5
    class_weight: {0: 1, 1: 1}
  uker_cohort_NF_30_days:
    n_estimators: 250
    max_depth: 10
    min_samples_split: 5
    class_weight: {0: 1, 1: 1}
  uker_cohort_aplasia_45_days:
    n_estimators: 250
    max_depth: 10
    min_samples_split: 5
    class_weight: {0: 1, 1: 1}

Xgboost:
  mimic_cohort_NF_30_days:
    learning_rate: 0.01
    max_depth: 3
    n_estimators: 200
    scale_pos_weight: 1
    objective: binary:logistic
    eval_metric: logloss
  mimic_cohort_aplasia_45_days:
    learning_rate: 0.10
    max_depth: 5
    n_estimators: 200
    scale_pos_weight: 1
    objective: binary:logistic
    eval_metric: logloss
  uker_cohort_NF_30_days:
    learning_rate: 0.10
    max_depth: 5
    n_estimators: 200
    scale_pos_weight: 1
    objective: binary:logistic
    eval_metric: logloss
  uker_cohort_aplasia_45_days:
    learning_rate: 0.10
    max_depth: 5
    n_estimators: 150
    scale_pos_weight: 1
    objective: binary:logistic
    eval_metric: logloss

CatBoost:
  mimic_cohort_NF_30_days:
    depth: 8
    learning_rate: 0.03
    n_estimators: 200
  mimic_cohort_aplasia_45_days:
    depth: 8
    learning_rate: 0.03
    n_estimators: 500
  uker_cohort_NF_30_days:
    depth: 8
    learning_rate: 0.03
    n_estimators: 500
  uker_cohort_aplasia_45_days:
    depth: 8
    learning_rate: 0.03
    n_estimators: 500

GAM:
  mimic_cohort_NF_30_days:
    lam: 20.0
    n_splines: 5
    spline_order: 3
  mimic_cohort_aplasia_45_days:
    lam: 20.0
    n_splines: 5
    spline_order: 3

HE-EBM:
  mimic_cohort_NF_30_days:
    top_k_per_expert: 150
    cv_folds: 5
    combiner_l2: 0.01

EBM:
  mimic_cohort_NF_30_days:
    max_bins: 128
    interactions: 2
    outer_bags: 14
    max_rounds: 500
    learning_rate: 0.015
    smoothing_rounds: 25
    interaction_smoothing_rounds: 25
    early_stopping_rounds: 100
    early_stopping_tolerance: 0.0001

  mimic_cohort_aplasia_45_days:
    max_bins: 128
    interactions: 3
    outer_bags: 4
    max_rounds: 100
    learning_rate: 0.05
    smoothing_rounds: 25
    interaction_smoothing_rounds: 25
    early_stopping_rounds: 30
    early_stopping_tolerance: 0.0001

GAMINET:
  mimic_cohort_NF_30_days:
    interact_num: 6
    batch_size: 1024
    activation_func: "ReLU"
    reg_clarity: 0.1
    max_epochs: [50, 100, 50]
    device: "cpu"
  mimic_cohort_aplasia_45_days:
    interact_num: 4
    batch_size: 1024
    activation_func: "ReLU"
    reg_clarity: 0.1
    max_epochs: [60, 100, 60]
    device: "cuda"

IGANN:
  mimic_cohort_NF_30_days:
    n_estimators: 150
    boost_rate: 0.1
    elm_scale: 1.0
    elm_alpha: 1.0
    n_hid: 10
    init_reg: 1.0
    act: "elu"
    early_stopping: 100
    device: "cpu"
    verbose: 0
    random_state: 42

NAM:
  mimic_cohort_NF_30_days:
    num_basis_functions: 64
    hidden_sizes: [128]
    dropout: 0.2
    feature_dropout: 0.05
    output_regularization: 0.05
    l2_regularization: 0.001
    lr: 0.01
    num_epochs: 100
    batch_size: 1024
    early_stopping_patience: 30
    val_fraction: 0.15
    device: "cuda"
    random_state: 42
    verbose: 1

MGAM:
  mimic_cohort_NF_30_days:
    max_support_size: 40
    num_lambda: 50
    algorithm: CD
    val_fraction: 0.15
    max_iter: 200
    random_state: 42
  mimic_cohort_aplasia_45_days:
    max_support_size: 40
    num_lambda: 50
    algorithm: CD
    val_fraction: 0.15
    max_iter: 200
    random_state: 42

DGAM:
  mimic_cohort_NF_30_days:
    k_lag: 3
    k_val: 3
    max_labs: 4
    min_lags: 3
    trend_model: "None"
    family: bernoulli
    backend: cmdstanr
    chains: 2
    burnin: 75
    samples: 75
    thin: 1
    parallel: true
    random_state: 42
    verbose: 1
    timeout: 450
  mimic_cohort_aplasia_45_days:
    k_lag: 3
    k_val: 3
    max_labs: 4
    min_lags: 3
    trend_model: "None"
    family: bernoulli
    backend: cmdstanr
    chains: 2
    burnin: 75
    samples: 75
    thin: 1
    parallel: true
    random_state: 42
    verbose: 1
    timeout: 450

SSTGAM:
  mimic_cohort_NF_30_days:
    fit_method: boost
    n_value_bases: 8
    learning_rate: 0.02
    max_rounds: 300
    early_stopping_rounds: 30
    outer_bags: 4
    val_fraction: 0.15
    random_state: 42
    verbose: 1
