Gradient Boosting:
  default:
    learning_rate: 0.1
    max_iter: 200
    max_depth: 5
    class_weight:
      0: 1
      1: 5

  grid_search:
    learning_rate: [0.01, 0.05, 0.1]
    max_iter: [100, 200]
    max_depth: [null, 5, 10]

Logistic Regression:
  default:
    C: 0.1
    penalty: l2
    class_weight: null
    max_iter: 2000

  grid_search:
    max_iter: [1000, 1500]
    C: [0.01, 0.1, 1]
    penalty: [l1, l2]
    class_weight:
      - null
      - {0: 1, 1: 2}
      - {0: 1, 1: 5}

Random Forest:
  default:
    n_estimators: 150
    max_depth: 10
    min_samples_split: 5
    class_weight:
      0: 1
      1: 1

  grid_search:
    n_estimators: [100, 200,250]
    max_depth: [5, 10]
    min_samples_split: [5,10,15]
    class_weight:
      - {0: 1, 1: 1}
      - {0: 1, 1: 2}

Xgboost:
  default:
    learning_rate: 0.1
    max_depth: 5
    n_estimators: 200
    scale_pos_weight: 2
    objective: binary:logistic
    eval_metric: logloss

  grid_search:
    learning_rate: [0.01, 0.1]
    max_depth: [3, 5]
    n_estimators: [100, 150, 200]
    scale_pos_weight: [1, 2]
    objective: [binary:logistic]

CatBoost:
  default:
    learning_rate: 0.1
    depth: 6
    n_estimators: 300

  grid_search:
    learning_rate: [0.1]
    depth: [4, 6, 8]
    n_estimators: [200, 300, 500]

GAM:
  default:
    lam: 20
    n_splines: 5
    spline_order: 3
    max_iter: 150

  grid_search:
    lam: [10, 20, 50, 100]
    n_splines: [4, 5, 6]
    spline_order: [3]
    max_iter: [150]

HE-EBM:
  default:
    top_k_per_expert: 150
    cv_folds: 5
    combiner_l2: 0.01

  grid_search:
    top_k_per_expert: [100, 150, 250]
    combiner_l2: [0.001, 0.01, 0.1]

IG-EBM:
  default:
    max_bins: 128
    outer_bags: 4
    max_rounds: 100
    learning_rate: 0.05
    smoothing_rounds: 25
    interaction_smoothing_rounds: 25
    early_stopping_rounds: 30
    early_stopping_tolerance: 0.0001

  grid_search:
    max_bins: [128]
    outer_bags: [8, 14]
    max_rounds: [500, 1000]
    learning_rate: [0.015]
    smoothing_rounds: [25]
    interaction_smoothing_rounds: [25]
    early_stopping_rounds: [100]
    early_stopping_tolerance: [0.0001]

EBM:
  default:
    max_bins: 128
    interactions: 3
    outer_bags: 4
    max_rounds: 100
    learning_rate: 0.05
    smoothing_rounds: 25
    interaction_smoothing_rounds: 25
    early_stopping_rounds: 30
    early_stopping_tolerance: 0.0001

  grid_search:
    max_bins: [128]
    interactions: [4, 6]
    outer_bags: [8, 14]
    max_rounds: [500, 1000]
    learning_rate: [0.015]
    smoothing_rounds: [25]
    interaction_smoothing_rounds: [25]
    early_stopping_rounds: [100]
    early_stopping_tolerance: [0.0001]

GAMINET:
  default:
    interact_num: 2
    batch_size: 1024
    activation_func: "ReLU"
    reg_clarity: 0.1
    max_epochs: [50, 50, 50]
    device: "cuda"

  grid_search:
    interact_num: [6, 8, 10]
    batch_size: [512, 1024]
    activation_func: ["ReLU"]
    reg_clarity: [0.05, 0.1, 0.2]
    max_epochs: [[50, 150, 100]]
    device: ["cuda"]

IGANN:
  default:
    n_estimators: 500
    boost_rate: 0.1
    elm_scale: 1.0
    elm_alpha: 0.75
    n_hid: 10
    init_reg: 1.0
    act: "elu"
    early_stopping: 200
    device: "cpu"
    verbose: 0
    random_state: 42

  grid_search:
    n_estimators: [5000]
    boost_rate: [0.05, 0.1]
    elm_scale: [1.0]
    elm_alpha: [0.5, 1.0]
    n_hid: [50, 100]
    init_reg: [1.0]
    act: ["elu"]
    early_stopping: [200]
    device: ["cpu"]
    verbose: [0]
    random_state: [42]

NAM:
  default:
    num_basis_functions: 64
    hidden_sizes: []
    dropout: 0.1
    feature_dropout: 0.0
    output_regularization: 0.05
    l2_regularization: 0.0
    lr: 0.01
    num_epochs: 30
    batch_size: 2048
    early_stopping_patience: 8
    val_fraction: 0.15
    device: "cpu"
    random_state: 42
    verbose: 1

  grid_search:
    num_basis_functions: [32, 64, 128]
    hidden_sizes: [[]]
    dropout: [0.0, 0.1, 0.2]
    feature_dropout: [0.0, 0.1]
    output_regularization: [0.0, 0.05, 0.1]
    l2_regularization: [0.0, 0.05, 0.1]
    lr: [0.005, 0.01, 0.05]
    num_epochs: [100]
    batch_size: [1024]
    early_stopping_patience: [20]
    val_fraction: [0.15]
    device: ["cuda"]
    random_state: [42]
    verbose: [0]

DGAM:
  default:
    k_lag: 3
    k_val: 3
    max_labs: 4
    min_lags: 3
    trend_model: "None"
    family: bernoulli
    backend: cmdstanr
    chains: 2
    burnin: 75
    samples: 75
    thin: 1
    parallel: true
    random_state: 42
    timeout: 450

  grid_search:
    k_lag: [3, 4]
    k_val: [3]
    max_labs: [4, 5]
    min_lags: [3]
    trend_model: ["None"]
    family: [bernoulli]
    backend: [cmdstanr]
    chains: [2]
    burnin: [75]
    samples: [75]
    thin: [1]
    parallel: [true]
    random_state: [42]
    timeout: [450]

MGAM:
  default:
    max_support_size: 40
    num_lambda: 50
    algorithm: CD
    val_fraction: 0.15
    max_iter: 200
    random_state: 42

  grid_search:
    max_support_size: [20, 40, 80, 150]

SSTGAM:
  default:
    fit_method: tree
    n_value_bins: 8
    tree_depth: 2
    n_value_bases: 8
    temporal_penalty: 1.0
    static_penalty: 1.0
    learning_rate: 0.02
    max_rounds: 100
    early_stopping_rounds: 15
    val_fraction: 0.15
    random_state: 42
    verbose: 1

  grid_search:
    fit_method: [tree]
    n_value_bins: [16, 32]
    tree_depth: [2, 3]
    learning_rate: [0.01, 0.02]
    max_rounds: [100]
    early_stopping_rounds: [15]
    val_fraction: [0.15]
    random_state: [42]
    verbose: [0]
