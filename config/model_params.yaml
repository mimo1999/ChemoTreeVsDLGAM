Gradient Boosting:
  default:
    learning_rate: 0.1
    max_iter: 200
    max_depth: 5
    class_weight:
      0: 1
      1: 5

  grid_search:
    learning_rate: [0.01, 0.05, 0.1]
    max_iter: [100, 200]
    max_depth: [null, 5, 10]
    #class_weight:
    #  - null
    #  - {0: 1, 1: 2}

Logistic Regression:
  default:
    C: 0.1
    penalty: l2
    class_weight: null
    max_iter: 2000

  grid_search:
    max_iter: [2000]
    C: [0.01, 0.1, 1]
    penalty: [l2]
    class_weight:
      - null
      - {0: 1, 1: 2}
      - {0: 1, 1: 5}

Random Forest:
  default:
    n_estimators: 150
    max_depth: 10
    min_samples_split: 5
    class_weight:
      0: 1
      1: 1

  grid_search:
    n_estimators: [100, 200,250]
    max_depth: [5, 10]
    min_samples_split: [5,10,15]
    class_weight:
      - {0: 1, 1: 1}
      - {0: 1, 1: 2}

Xgboost:
  default:
    learning_rate: 0.1
    max_depth: 5
    n_estimators: 200
    scale_pos_weight: 2
    objective: binary:logistic
    eval_metric: logloss

  grid_search:
    learning_rate: [0.01, 0.1]
    max_depth: [3, 5]
    n_estimators: [100, 150, 200]
    scale_pos_weight: [1, 2]
    objective: [binary:logistic]
    #eval_metric: logloss



CatBoost:
  default:
    learning_rate: 0.1
    depth: 6
    n_estimators: 300

  grid_search:
    learning_rate: [0.03, 0.1]
    depth: [4, 6, 8]
    n_estimators: [200, 300, 500]

GAM:
  default:
    lam: 30.0
    n_splines: 4
    spline_order: 3
    max_iter: 200

  grid_search:
    lam: [10.0, 20.0, 40.0]
    n_splines: [4, 6]
    spline_order: [3]
    max_iter: [150]

GAMINET:
  default:
    max_features: 500
    interact_num: 2
    batch_size: 1024
    activation_func: "ReLU"
    reg_clarity: 0.1
    max_epochs: [50, 50, 50]
    device: "cuda"

  grid_search:
    max_features: [300, 500]
    interact_num: [2, 5]
    batch_size: [1024]
    activation_func: ["ReLU"]
    reg_clarity: [0.1]
    max_epochs: [[50, 50, 50]]
    device: ["cuda"]


EBM:
  default:
    max_features: 500
    max_bins: 128
    interactions: 6
    outer_bags: 8
    max_rounds: 500
    learning_rate: 0.01
    smoothing_rounds: 10
    interaction_smoothing_rounds: 10
    early_stopping_rounds: 100
    early_stopping_tolerance: 0.0001

  grid_search:
    max_features: [300, 500]
    max_bins: [128]
    interactions: [3, 6]
    outer_bags: [4, 8]
    max_rounds: [200, 500]
    learning_rate: [0.05, 0.1]
    smoothing_rounds: [10, 25]
    interaction_smoothing_rounds: [10, 25]
    early_stopping_rounds: [30]
    early_stopping_tolerance: [0.0001]
